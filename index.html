msgN=e=>{const c=calc(e,T);return `Estimado/a ${e.rep||'representante'}: reciba un cordial saludo. Le informo que ${e.n}, en ${RG().a}, tiene en el ${T}.º trimestre una nota de ${f(c.nota)||'pendiente'}`+(c.unosP?` y ${c.unosP} tarea(s) sin entregar estando presente`:'')+(c.unosA?` (${c.unosA} tarea(s) corresponde(n) a días en que faltó a clases)`:'')+`. Este informe se emite conforme a los Art. 23 y 25 del Reglamento General a la LOEI.`+(c.nota!=null&&c.nota<7?` Se ofrecerá refuerzo pedagógico (Art. 32) y puede solicitar rendir una evaluación para mejorar calificaciones inferiores a 10 (Art. 36).`:'')+` Quedo atento/a a su consulta. Agradezco confirmar la recepción de este mensaje. Atentamente, ${S.cfg.doc}`},
msgA=e=>{const A=S.at[R]||{},ds=Object.keys(A).sort(),fa=ds.filter(d=>A[d][e.id]==='X').map(fd),fu=ds.filter(d=>A[d][e.id]==='F').map(fd);
return `Estimado/a ${e.rep||'representante'}: reciba un cordial saludo. Le informo que ${e.n} registra inasistencia en ${RG().a} los días: ${fa.join(', ')||'—'}. Estas inasistencias se encuentran pendientes de justificación. Conforme al Art. 171 del Reglamento General a la LOEI, la justificación se presenta a más tardar dos días después del retorno del estudiante a clases, ante el tutor o guía del curso; si la inasistencia excede tres días continuos, se presenta con la documentación respectiva ante la máxima autoridad o el inspector general.`+(fu.length?` Además registra fuga de clases el ${fu.join(', ')} (Art. 172 del Reglamento General a la LOEI: una vez iniciadas las clases el estudiante no puede ausentarse sin permiso).`:'')+` Solicito acercarse a dialogar conmigo y presentar la documentación, o enviar la justificación a la brevedad. Agradezco confirmar la recepción de este mensaje. Atentamente, ${S.cfg.doc}, docente de ${RG().a}.`};
let NT=null;
function notif(v){const[i,t]=v.split('|'),e=S.est.find(x=>x.id==i);
if(!(NT&&NT.e==i&&NT.t==t&&NT.r==R))NT={id:uid(),e:i,r:R,t,m:t=='a'?msgA(e):t=='f'?msgF(e):t=='r'?msgR(e):msgN(e),q:T};
const L=S.log.find(x=>x.id==NT.id)||{},sb=encodeURIComponent((t=='a'?'Notificación de inasistencia – ':t=='f'?'Felicitación por el rendimiento – ':t=='r'?'Aviso sobre el rendimiento académico – ':'Informe de rendimiento – ')+e.n),bc=S.cfg.mail?'&amp;bcc='+encodeURIComponent(S.cfg.mail):'';

26:['Art. 26 · Escalas de calificación','El rendimiento se expresa en escalas cuantitativas y cualitativas, que se asientan según la tabla del propio Reglamento (la tabla numérica figura en el Registro Oficial).'],
32:['Art. 32 · Refuerzo pedagógico','Si la evaluación continua muestra bajos resultados, se aplica de inmediato refuerzo pedagógico (clases, tutorías, cronograma de estudio en casa); los trabajos del refuerzo se califican y se promedian con las demás notas.'],
34:['Art. 34 · Evaluaciones de período','Son evaluaciones sumativas al final de cada período, diseñadas con al menos quince días de anticipación; si hay fuerza mayor justificada, se reprograman.'],

async function leeJ(f){if(!f)return;try{carga(JSON.parse(await f.text()));render();aviso('Respaldo cargado')}catch(e){aviso('Ese archivo no es un respaldo válido')}}
async function leeX(f){if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});impPrev(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}))}catch(e){aviso('No pude leer ese archivo')}}
function impPrev(rows){const hd=(rows[0]||[]).map(x=>nrm(x).join(' ')),ix={},set=(k,i)=>{if(ix[k]==null)ix[k]=i};
hd.forEach((h,i)=>{if(/CORREO|MAIL/.test(h))set('m',i);else if(/WHATS|TELEFONO|CELULAR|MOVIL/.test(h))set('t',i);else if(/ESTUDIANTE|ALUMN/.test(h))set('e',i);else if(/REPRESENTANTE|PADRE|MADRE|APODERAD/.test(h))set('r',i)});
if(ix.e==null)return aviso('No encontré la columna del estudiante. La primera fila debe tener los títulos de las preguntas.');
IMP=rows.slice(1).filter(r=>r[ix.e]).map(r=>{const tk=nrm(r[ix.e]);let b=null,sc=0;S.est.forEach(e=>{const j=jac(tk,nrm(e.n));if(j>sc){sc=j;b=e}});return{n:r[ix.e],e:sc>=.75?b:null,rep:String(r[ix.r]||'').trim(),tel:ph(r[ix.t]),mail:String(r[ix.m]||'').trim()}});
const ok=IMP.filter(x=>x.e).length;
D(`<h3>Revisar respuestas</h3><p>${ok} de ${IMP.length} coinciden con un estudiante de tu lista.</p><div class="sc" style="max-height:50vh;overflow:auto"><table><thead><tr><th>Respuesta</th><th>Estudiante en tu lista</th><th>Representante</th><th>WhatsApp</th><th>Correo</th></tr></thead><tbody>${IMP.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.e?esc(x.e.n):'<b style="color:var(--bad)">Sin coincidencia</b>'}</td><td>${esc(x.rep)}</td><td>${esc(x.tel)}</td><td>${esc(x.mail)}</td></tr>`).join('')}</tbody></table></div><div class="bar" style="margin-top:10px"><button class="pri" data-do="impok">Aplicar a los ${ok} que coinciden</button><button data-do="x">Cancelar</button></div>`,'min(900px,96vw)')}
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('cuaderno-fotos',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>ok(q.result);q.onerror=()=>no()}),
fput=async(k,v)=>{try{const st=(await idb()).transaction('f','readwrite').objectStore('f');if(v)st.put(v,k);else st.delete(k)}catch(e){}},
fget=k=>idb().then(d=>new Promise(ok=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})).catch(()=>null),
comp=f=>new Promise(ok=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const z=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.72))};im.src=u}),
showF=x=>{const e=$('#fv');if(e)e.innerHTML=x?`<img src="${x}" alt="Foto de la tarea" style="max-width:100%;border-radius:8px"> <button data-do="fdel">Quitar foto</button>`:''};
function dAct(id){FK=id||uid();dAct0(id);fget(FK).then(showF)}
function vMin(){const r=ES().map((e,i)=>[i+1,e.ced||'',e.n,calc(e,T).nota]);
return chips()+`</div><p class="note">Pensado para copiar y pegar en la plataforma del Ministerio. Revisa siempre el orden y los valores antes de subirlos; las cédulas se guardan solo en este equipo.</p><div class="bar"><button data-do="mcn" data-v=",">Copiar notas (coma)</button><button data-do="mcn" data-v=".">Copiar notas (punto)</button><button data-do="mcc">Copiar cédula y nota</button><button data-do="mxl">Descargar Excel</button></div><div class="sc"><table><thead><tr><th>Nº</th><th>Cédula</th><th>Estudiante</th><th>Nota ${T}.º trim.</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]?esc(x[1]):'<span class="note">falta</span>'}</td><td>${esc(x[2])}</td><td class="c ${cls(x[3])}">${f(x[3])}</td></tr>`).join('')}</tbody></table></div>`}
const BJ=()=>+String(S.cfg.bj||7).replace(',','.')||7,TN=()=>parseInt(S.cfg.tn)||3;
function riesgo(e){const c=calc(e,T),v=c.nota!=null?c.nota:c.fp,m=[];if(v!=null&&v<BJ())m.push((c.nota!=null?'Nota ':'Prom. de actividades ')+f(v));if(c.unosP>=TN())m.push(c.unosP+' tareas sin entregar');return m}
const msgR=e=>{const c=calc(e,T),v=c.nota!=null?c.nota:c.fp,ac=S.act.filter(a=>a.t==T&&a.r==R&&gv(e.id+'|'+a.id)===1&&!AB(e,a)).sort((a,b)=>a.f.localeCompare(b.f)).map(a=>a.n+' ('+fd(a.f)+')');
return `Estimado/a ${e.rep||'representante'}: reciba un cordial saludo. Le informo que ${e.n} presenta en ${RG().a}, durante el ${T}.º trimestre, ${c.nota!=null?'una nota de ':'un promedio de actividades de '}${f(v)||'pendiente'}`+(ac.length?` y ${ac.length} tarea(s) sin entregar estando presente: ${ac.join(', ')}`:'')+`. Conforme al Art. 32 del Reglamento General a la LOEI se aplicará refuerzo pedagógico, y según el Art. 36 puede rendir una evaluación para mejorar calificaciones inferiores a 10. Solicito acercarse a dialogar conmigo para acordar estrategias de apoyo. Agradezco confirmar la recepción de este mensaje. Atentamente, ${S.cfg.doc}, docente de ${RG().a}.`};
function riesgoHTML(){const L=ES().map(e=>({e,m:riesgo(e)})).filter(x=>x.m.length);
return `<div class="card"><b>Para avisar por bajo rendimiento o tareas sin entregar</b><p class="note">Criterio: nota o promedio de actividades menor a ${f(BJ())}, o ${TN()} o más tareas sin entregar estando presente (se cambia en Ajustes).</p>`+(L.length?L.map(x=>{const g=S.log.find(z=>z.t=='r'&&z.e==x.e.id&&z.r==R&&z.q==T&&(z.w||z.c));return `<p style="margin:6px 0">${esc(x.e.n)}: ${x.m.join(' · ')} ${g?`<span class="hi">✔ avisado ${fdt(g.w||g.c).slice(0,10)}</span> <button data-do="wz" data-v="${x.e.id}|r">Volver a avisar</button>`:`<button class="pri" data-do="wz" data-v="${x.e.id}|r">Notificar</button>`}</p>`}).join(''):'<p>Ningún estudiante cumple el criterio en este trimestre.</p>')+`</div>`}
let NI=null;
const pn=v=>{if(typeof v=='number')return v>=0&&v<=10?v:null;const t=String(v).trim().replace(',','.');if(!/^\d+(\.\d+)?$/.test(t))return null;const x=+t;return x<=10?x:null},
cl=i=>XLSX.utils.encode_col(i);
function analiza(rows){const E=ES(),en=E.map(e=>nrm(e.n)),cols={};
rows.forEach((r,ri)=>r.forEach((v,ci)=>{if(typeof v=='string'&&v.trim().length>5){const tk=nrm(v);if(tk.length<2)return;let b=-1,sc=0;en.forEach((x,i)=>{const j=jac(tk,x);if(j>sc){sc=j;b=i}});if(sc>=.75)(cols[ci]=cols[ci]||[]).push([ri,b,v])}}));
const ks=Object.keys(cols).sort((a,b)=>cols[b].length-cols[a].length);if(!ks.length)return null;
const nc=+ks[0],seen=new Set(),hits=cols[nc].filter(h=>!seen.has(h[1])&&seen.add(h[1])),num={};
hits.forEach(h=>rows[h[0]].forEach((v,ci)=>{if(ci!=nc&&pn(v)!=null)num[ci]=(num[ci]||0)+1}));
const first=Math.min(...hits.map(h=>h[0])),lab=ci=>{for(let r=first-1;r>=0;r--){const t=rows[r][ci];if(typeof t=='string'&&t.trim())return t.trim().slice(0,40)}return 'Columna '+cl(ci)},
cand=Object.keys(num).map(Number).sort((a,b)=>num[b]-num[a]).map(ci=>({ci,n:num[ci],l:lab(ci)})).filter(c=>!/^n[°º.o]*$/i.test(c.l));
if(!cand.length)return null;
return{rows,hits,E,cand,ok:hits.length,sel:cand[0].ci,fld:'pr',t:T,all:true}}
async function leeN(f,fl){if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});let best=null;
wb.SheetNames.forEach(n=>{const a=analiza(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}));if(a&&(!best||a.ok>best.ok))best={...a,sheet:n}});
if(!best)return aviso('No encontré estudiantes de este curso en el archivo. Elige primero el registro del curso correcto.');if(fl){const k=['1er','2do','3er'][T-1],c=best.cand.find(c=>c.l.toLowerCase().includes(k));if(c)best.sel=c.ci}NI=best;if(fl)NI.fld=fl;NI.f=f.name;impN()}catch(e){aviso('No pude leer ese archivo')}}

<label>Trimestre<select id="cit">${[1,2,3].map(t=>`<option value="${t}"${t==T?' selected':''}>${['1er','2do','3er'][t-1]} trimestre</option>`).join('')}</select></label>
<p style="margin:6px 0 2px"><b>Cursos y asignaturas</b></p>${S.reg.map(r=>{const n=conR(r.id,()=>ES().length);return `<label ${lb}><input type="checkbox" class="cir" value="${r.id}" style="width:auto"${n?' checked':' disabled'}> ${esc(r.a)} · ${esc(CN(r))} <span class="note">(${n} est.)</span></label>`}).join('')}
<p style="margin:8px 0 2px"><b>Documentos</b></p>${CID.map(([k,t])=>`<label ${lb}><input type="checkbox" class="cid" value="${k}" style="width:auto" checked> ${t}</label>`).join('')}
<div style="display:flex;gap:8px;margin-top:8px"><label style="flex:1">Lugar<input id="cil" value="Cumandá"></label><label style="flex:1">Fecha<input id="cif" type="date" value="${hoy()}"></label></div>
<label>Vicerrector/a<input id="civ" value="${esc(S.cfg.vice||'Lic. Wilson Sánchez Mgs.')}"></label>
<div style="display:flex;gap:8px"><label style="flex:1">Año lectivo<input id="cia" value="2026-2027"></label><label style="flex:1">Horario del refuerzo<input id="cih" placeholder="Ej.: martes y jueves, 13:00 a 14:00"></label></div>
<p class="note">El tutor de cada curso sale de lo que escribiste antes en el informe por asignatura. Las destrezas planificadas y logradas quedan en blanco para completarlas a mano en el Word.</p>
<p id="cim" class="note"></p><div class="bar" style="margin-top:10px"><button class="pri" data-do="cieg">Generar ZIP</button><button data-do="x">Cancelar</button></div>`,'min(640px,96vw)')}
async function cieRun(){const ids=[...document.querySelectorAll('.cir:checked')].map(x=>x.value),dd=[...document.querySelectorAll('.cid:checked')].map(x=>x.value),m=$('#cim');
if(!ids.length||!dd.length)return aviso('Elige al menos un curso y un documento');
if(!window.JSZip)return aviso('No cargó la librería ZIP; revisa tu conexión');
const vi=$('#civ').value.trim(),lg=$('#cil').value.trim(),fe=fLarga($('#cif').value||hoy()),an=$('#cia').value.trim(),ho=$('#cih').value.trim();S.cfg.vice=vi;save();const t0=T,TT=+$('#cit').value||T;T=TT;
const r0=R,n0=NTS,p0=NTP,z=new JSZip(),ok=[],er=[],res=['CIERRE DEL '+T+'.º TRIMESTRE · '+fe,'Docente: '+(S.cfg.doc||''),''],
tarea=async(nom,fn)=>{try{await fn();ok.push(nom)}catch(x){er.push(nom+': '+((x&&x.message)||'error'))}},
obs=x=>{const q=[];if(x.cs.includes('ta'))q.push('Deberes y actividades sin entregar.');if(x.cs.includes('es'))q.push('No estudia para lecciones y exámenes.');if(x.cs.includes('pr'))q.push('No realizó el proyecto interdisciplinario.');return q.join(' ')||'Bajo rendimiento académico.'};
try{for(let i=0;i<ids.length;i++){R=ids[i];const rg=RG(),cu=CN(rg),dir=fn(rg.a+'-'+cu),fo=z.folder(dir),c=S.cur.find(x=>x.id==rg.c);
m&&(m.textContent='Procesando '+(i+1)+' de '+ids.length+': '+rg.a+' · '+cu+'…');await new Promise(r=>setTimeout(r,20));
const bs=infDatos(),ks=['ta','es','ex','pr'].filter(k=>k=='es'?bs.ex:bs[k]),nm=t=>rg.a+' · '+cu+' · '+t;
res.push(rg.a+' · '+cu+': '+bs.L.length+' estudiantes con nota, promedio '+f(bs.pm)+', '+bs.B.length+' con nota menor a 7.');
const sc=bs.B.filter(x=>!x.cs.length).length;if(sc&&(dd.includes('infw')||dd.includes('infp')))res.push('   '+sc+' estudiante(s) con nota trimestral directa: sin causa detectada; complétala en el informe.');
if(dd.includes('infw')||dd.includes('infp')){const o=infMk({tu:c&&c.tut||'',vi,ks,co:infCon(ks),fa:'',p:'',l:'',ps:bs.B.map(x=>x.cs)});
if(dd.includes('infw'))await tarea(nm('Informe Word'),async()=>{fo.file('Informe-por-asignatura-T'+T+'.docx',await infDoc(o))});
if(dd.includes('infp'))await tarea(nm('Informe PDF'),async()=>{fo.file('Informe-por-asignatura-T'+T+'.pdf',infPdf(o,true))})}
if(dd.includes('tri'))await tarea(nm('Informe del trimestre'),async()=>{fo.file('Informe-trimestre-T'+T+'.pdf',mkPDF('INFORME DEL '+T+'.º TRIMESTRE',cab(),[{hd:['No','Estudiante','Prom. formativa','Examen','Proyecto','Mejora','Nota','Escala'],w:[8,60,22,16,18,16,16,24],hl:6,r:dTri().map(fm)},...lgP([23,24,25,26,36])],false,true))});
if(dd.includes('nt'))await tarea(nm('Notas trimestrales'),async()=>{NTS=[T];NTP=0;const q=ntDatos();fo.file('Notas-trimestrales-T'+T+'.pdf',mkPDF('NOTAS TRIMESTRALES',cab(),[{hd:q.hd,w:[8,142,30],r:q.r}],false,true))});
if(dd.includes('mini'))await tarea(nm('Excel Ministerio'),async()=>{fo.file('Notas-Ministerio-T'+T+'.xlsx',await mkXLS([{n:'Notas',hd:['No','Cedula','Estudiante','Nota'],rows:ES().map((e,j)=>[j+1,e.ced||'',e.n,calc(e,T).nota])}],'NOTAS DEL '+T+'.º TRIMESTRE',cab()))});
if(dd.includes('acta')){if(!bs.B.length)res.push('   Sin estudiantes bajo 7: no se genera acta de refuerzo.');else await tarea(nm('Acta de refuerzo'),async()=>{fo.file('Acta-refuerzo-T'+T+'.pdf',aPdf(actaModel({rows:bs.B.map(x=>({n:x.e.n,rep:x.e.rep||'',obs:obs(x)})),lg,fe,vi,an,ho}),true))})}}}
finally{R=r0;NTS=n0;NTP=p0;T=t0}
if(er.length)res.push('','No se pudo generar:',...er);
z.file('Resumen-T'+TT+'.txt',res.join('\r\n'));
const bl=await z.generateAsync({type:'blob',mimeType:'application/zip'});
$('#d').close();guarda('Cierre-trimestre-T'+TT+'-'+hoy()+'.zip',bl);aviso(er.length?'ZIP generado, pero '+er.length+' documento(s) fallaron (mira Resumen-T'+TT+'.txt)':'ZIP generado con '+ok.length+' documento(s)');render()}
